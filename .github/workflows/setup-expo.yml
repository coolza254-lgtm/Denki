# Run once: links this repo to your Expo account and enables in-app updates.
name: 1. ตั้งค่า Expo (ครั้งแรก)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - run: eas init --non-interactive --force
      - run: eas update:configure --platform android --non-interactive
      - name: Commit app.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app.json
          git diff --cached --quiet || git commit -m "Link Expo project for in-app updates"
          git push
