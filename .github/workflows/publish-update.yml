# Every push to the default branch is checked, then sent to the phone as an
# in-app update.
name: 3. ส่งอัปเดตเข้าแอป
on:
  push:
  workflow_dispatch:
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Skip until Expo is set up
        id: linked
        run: grep -q projectId app.json && echo "ok=true" >> "$GITHUB_OUTPUT" || echo "Run workflow 1 first"
      - uses: expo/expo-github-action@v8
        if: steps.linked.outputs.ok == 'true'
        with: { eas-version: latest, token: '${{ secrets.EXPO_TOKEN }}' }
      - if: steps.linked.outputs.ok == 'true'
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --branch production --platform android --non-interactive --message "$MESSAGE"
